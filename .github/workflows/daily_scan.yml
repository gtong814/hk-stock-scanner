name: Daily HK Connect Scan

on:
  schedule:
    # 每個星期一至五，香港時間 16:40（UTC 08:40）自動執行
    - cron: '40 8 * * 1-5'
  workflow_dispatch: # 允許隨時按按鈕手動執行測試

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance akshare pandas numpy

      - name: Run HK Connect Scanner
        run: python scanner.py

      - name: Commit and push scan_results.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scan_results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update HK Connect scan results"
          git push
