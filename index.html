<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Sir Combo Engine | 港股通自動化掃描平台</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131a2a;
      --bg-card-hover: #192236;
      --bg-header: #0f1523;
      --border-color: #1f293d;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }

    /* 頂部導覽列 */
    .navbar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
    .brand-title h1 { font-size: 16px; font-weight: 700; }
    .brand-title p { font-size: 11px; color: var(--text-secondary); }

    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--accent-gold);
      color: #0b0f19;
    }
    .tab-btn:hover:not(.active) {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-pill {
      font-size: 11px;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
    }
    select, input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .btn-reload {
      background: var(--accent-gold);
      color: #0b0f19;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    /* 主容器 */
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* Hero 橫幅 */
    .hero {
      background: linear-gradient(135deg, #131c31 0%, #0f172a 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .hero-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .hero h2 { font-size: 24px; margin-bottom: 6px; }
    .hero p { color: var(--text-secondary); font-size: 13px; }

    /* 四大統計卡 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
    }
    .stat-card .label { font-size: 12px; color: var(--text-secondary); }
    .stat-card .value { font-size: 28px; font-weight: 800; margin: 4px 0; }
    .stat-card .sub { font-size: 12px; color: var(--accent-green); }

    /* 精準篩選工具列 */
    .filter-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .quick-filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .qf-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .qf-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-blue);
      color: #60a5fa;
    }
    .qf-btn.golden.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent-green);
      color: #34d399;
    }

    /* 股票卡片網格 */
    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
    }
    .stock-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      transition: 0.2s;
      position: relative;
    }
    .stock-card:hover {
      background: var(--bg-card-hover);
      border-color: #334155;
      transform: translateY(-2px);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .stock-code { font-size: 15px; font-weight: 700; }
    .stock-name { font-size: 13px; color: var(--text-secondary); margin-left: 6px; }
    .step-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .step-done { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .step-near { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .step-run  { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }
    .price { font-size: 22px; font-weight: 800; }
    .chg-up { color: var(--accent-green); font-size: 13px; font-weight: 700; }
    .chg-down { color: var(--accent-red); font-size: 13px; font-weight: 700; }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      min-height: 22px;
    }
    .tag-ep-sweet {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .tag-ep-normal {
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-fresh {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .star-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      margin-left: 6px;
    }
    .star-btn.active { color: var(--accent-gold); }

    svg.sparkline { width: 100%; height: 38px; display: block; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <div class="logo-badge">SS</div>
      <div class="brand-title">
        <h1>Sky Sir Combo Engine</h1>
        <p>港股通自動化掃描平台 (HKEX)</p>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('overview', this)">總覽</button>
      <button class="tab-btn" onclick="switchTab('scanner', this)">港股通掃描器</button>
      <button class="tab-btn" onclick="switchTab('watchlist', this)">自選清單 (<span id="watch-count">0</span>)</button>
    </div>

    <div class="controls">
      <span class="status-pill" id="update-status">載入數據中...</span>
      <select id="combo-select" onchange="renderAll()">
        <option value="S陽TERE">S陽TERE (向上 5步)</option>
        <option value="TERE">TERE (向上 4步)</option>
        <option value="S陽TE">S陽TE (向上 3步)</option>
        <option value="R陰E">R陰E (向下 2步)</option>
        <option value="黑白DE">黑白DE (向下 2步)</option>
      </select>
      <button class="btn-reload" onclick="loadData()">↻ 重新載入最新數據</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-tag">⚡ Pine Script v6 狀態機引擎</div>
      <h2>Sky Sir Combo Engine</h2>
      <p>自動追蹤港股通 TERE、S陽TE、S陽TERE、R陰E、黑白DE 組合步驟、EP 觸發位、距 EP 百分比與 Reset 止損位。</p>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="label">掃描池股票總數</div>
        <div class="value" id="stat-total">-</div>
        <div class="sub">覆蓋港股通成份股</div>
      </div>
      <div class="stat-card">
        <div class="label">近 3 日剛達標 (黃金新鮮訊號)</div>
        <div class="value" id="stat-fresh" style="color:#34d399;">-</div>
        <div class="sub">Completed 且距今 ≤ 3 個交易日</div>
      </div>
      <div class="stat-card">
        <div class="label">臨門一腳潛力股 (距 EP ≤ 3%)</div>
        <div class="value" id="stat-near" style="color:#f59e0b;">-</div>
        <div class="sub">處於最後一步，即將突破 EP</div>
      </div>
      <div class="stat-card">
        <div class="label">高成交活躍股 (≥ 1億)</div>
        <div class="value" id="stat-active">-</div>
        <div class="sub" id="stat-completed-sub">總已達成組合數: -</div>
      </div>
    </section>

    <section class="filter-bar">
      <div class="quick-filters">
        <button class="qf-btn golden active" onclick="setFilterMode('golden_all', this)">🔥 黃金獵殺 (近3日剛達標 + 臨門一腳)</button>
        <button class="qf-btn" onclick="setFilterMode('recent_3d', this)">⚡ 近 3 日剛達標 (EP ±5%內)</button>
        <button class="qf-btn" onclick="setFilterMode('about_to_break', this)">🎯 臨門一腳 (最後一步且距EP ≤3%)</button>
        <button class="qf-btn" onclick="setFilterMode('completed_all', this)">✅ 全部已完成 (Completed)</button>
        <button class="qf-btn" onclick="setFilterMode('all', this)">📊 全部港股通</button>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <select id="turnover-filter" onchange="renderAll()">
          <option value="100">成交額 ≥ 1億</option>
          <option value="50">成交額 ≥ 5,000萬</option>
          <option value="0">不限成交額</option>
        </select>
        <input type="text" id="search-input" placeholder="搜尋代號或名稱 (如 1810)" oninput="renderAll()" />
      </div>
    </section>

    <section class="stock-grid" id="stock-grid"></section>
  </main>

  <script>
    let rawData = { stocks: [] };
    let currentTab = "overview";
    let filterMode = "golden_all";
    let watchlist = JSON.parse(localStorage.getItem("sky_sir_watchlist") || '["1810.HK"]');

    function saveWatchlist() {
      localStorage.setItem("sky_sir_watchlist", JSON.stringify(watchlist));
      document.getElementById("watch-count").textContent = watchlist.length;
    }

    function toggleWatch(ticker) {
      if (watchlist.includes(ticker)) {
        watchlist = watchlist.filter(t => t !== ticker);
      } else {
        watchlist.push(ticker);
      }
      saveWatchlist();
      renderAll();
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAll();
    }

    function setFilterMode(mode, btn) {
      filterMode = mode;
      document.querySelectorAll(".qf-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAll();
    }

    async function loadData() {
      try {
        const res = await fetch(`scan_results.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("無法讀取 scan_results.json");
        rawData = await res.json();
        document.getElementById("update-status").textContent =
          `● 數據已連接 (${rawData.total_scanned} 隻 · ${rawData.updated_at})`;
        saveWatchlist();
        renderAll();
      } catch (err) {
        document.getElementById("update-status").textContent = "⚠️ 讀取失敗，請確認透過本地伺服器開啟";
        console.error(err);
      }
    }

    function buildSparkline(points, isUp) {
      if (!points || points.length < 2) return "";
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const w = 280, h = 38, pad = 3;
      const coords = points.map((v, i) => {
        const x = (i / (points.length - 1)) * w;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const stroke = isUp ? "#10b981" : "#ef4444";
      return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline fill="none" stroke="${stroke}" stroke-width="2" points="${coords}" />
      </svg>`;
    }

    function renderAll() {
      const comboKey = document.getElementById("combo-select").value;
      const minTurnover = parseFloat(document.getElementById("turnover-filter").value) || 0;
      const keyword = document.getElementById("search-input").value.trim().toLowerCase();
      const stocks = rawData.stocks || [];

      // 計算統計指標
      let totalCompleted = 0, freshCompleted = 0, nearBreakout = 0, highTurnover = 0;
      stocks.forEach(s => {
        if (s.turnover_m >= 100) highTurnover++;
        const c = s.combos?.[comboKey];
        if (!c) return;
        if (c.completed) {
          totalCompleted++;
          if (c.days_since_event !== null && c.days_since_event <= 3) freshCompleted++;
        } else if (c.step === c.max_step - 1 && c.dist_to_ep_pct !== null && Math.abs(c.dist_to_ep_pct) <= 3.0) {
          nearBreakout++;
        }
      });

      document.getElementById("stat-total").textContent = stocks.length;
      document.getElementById("stat-fresh").textContent = freshCompleted;
      document.getElementById("stat-near").textContent = nearBreakout;
      document.getElementById("stat-active").textContent = highTurnover;
      document.getElementById("stat-completed-sub").textContent = `總已達成組合數: ${totalCompleted}`;

      // 過濾股票
      let filtered = stocks.filter(s => {
        if (currentTab === "watchlist" && !watchlist.includes(s.ticker)) return false;
        if (s.turnover_m < minTurnover) return false;
        if (keyword && !s.ticker.toLowerCase().includes(keyword) && !s.name.toLowerCase().includes(keyword)) return false;

        const c = s.combos?.[comboKey];
        if (!c) return false;

        if (currentTab === "watchlist") return true;

        const isRecent3d = c.completed && c.days_since_event !== null && c.days_since_event <= 3 &&
                           c.dist_to_ep_pct !== null && Math.abs(c.dist_to_ep_pct) <= 5.0;
        const isAboutToBreak = !c.completed && c.step === (c.max_step - 1) &&
                               c.dist_to_ep_pct !== null && Math.abs(c.dist_to_ep_pct) <= 3.0;

        if (filterMode === "golden_all") return isRecent3d || isAboutToBreak;
        if (filterMode === "recent_3d") return isRecent3d;
        if (filterMode === "about_to_break") return isAboutToBreak;
        if (filterMode === "completed_all") return c.completed;
        return true;
      });

      // 排序：優先顯示「最近剛觸發」與「最貼近 EP 位」的股票
      filtered.sort((a, b) => {
        const ca = a.combos[comboKey], cb = b.combos[comboKey];
        const da = ca.days_since_event ?? 999;
        const db = cb.days_since_event ?? 999;
        if (da !== db) return da - db;
        return Math.abs(ca.dist_to_ep_pct ?? 999) - Math.abs(cb.dist_to_ep_pct ?? 999);
      });

      if (currentTab === "overview") {
        filtered = filtered.slice(0, 24);
      }

      const grid = document.getElementById("stock-grid");
      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;">
          目前條件下沒有符合的股票，請嘗試放寬成交額或切換篩選條件。
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const c = s.combos[comboKey];
        const isStar = watchlist.includes(s.ticker);
        const chgClass = s.change_pct >= 0 ? "chg-up" : "chg-down";
        const chgSign = s.change_pct > 0 ? `+${s.change_pct}%` : `${s.change_pct}%`;

        let stepClass = "step-run";
        if (c.completed) stepClass = "step-done";
        else if (c.step === c.max_step - 1) stepClass = "step-near";

        // 距 EP 標籤
        let distBadge = "";
        if (c.dist_to_ep_pct !== null) {
          const sign = c.dist_to_ep_pct > 0 ? `+${c.dist_to_ep_pct}%` : `${c.dist_to_ep_pct}%`;
          const isSweet = Math.abs(c.dist_to_ep_pct) <= 3.0;
          distBadge = `<span class="${isSweet ? 'tag-ep-sweet' : 'tag-ep-normal'}">距 EP: ${sign}</span>`;
        }

        // 新鮮度標籤
        let freshBadge = "";
        if (c.days_since_event !== null && c.days_since_event <= 5) {
          const dayText = c.days_since_event === 0 ? "今日觸發" : `${c.days_since_event}日前 (${c.last_event})`;
          freshBadge = `<span class="tag-fresh">🔥 ${dayText}</span>`;
        }

        return `
          <div class="stock-card">
            <div class="card-top">
              <div>
                <span class="stock-code">${s.ticker}</span>
                <span class="stock-name">${s.name}</span>
                <button class="star-btn ${isStar ? 'active' : ''}" onclick="toggleWatch('${s.ticker}')" title="加入/移除自選">★</button>
              </div>
              <span class="step-badge ${stepClass}">Step ${c.step}/${c.max_step}</span>
            </div>

            <div class="price-row">
              <span class="price">${s.close.toFixed(2)}</span>
              <span class="${chgClass}">${chgSign}</span>
            </div>

            <div class="meta-row">
              <span>EP: <strong>${c.ep_level ?? '-'}</strong> ${c.reset_level ? `| 止損: ${c.reset_level}` : ''}</span>
              <span>成交: HK$${s.turnover_m}M</span>
            </div>

            <div class="badges-row">
              ${distBadge}
              ${freshBadge}
            </div>

            ${buildSparkline(s.sparkline, s.change_pct >= 0)}
          </div>
        `;
      }).join("");
    }

    loadData();
  </script>
</body>
</html>
